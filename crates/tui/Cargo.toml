[package]
name = "bili-music-tui"
version.workspace = true
edition.workspace = true
description = "Bilibili audio-only music player with a terminal UI"

[[bin]]
name = "bili-music"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bili-core.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["process", "signal"] }
unicode-width = "0.2.3"

# Only used for PR_SET_PDEATHSIG, so the player cannot outlive us on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
