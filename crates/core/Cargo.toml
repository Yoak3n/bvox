[package]
name = "bili-core"
version.workspace = true
edition.workspace = true
description = "Platform-agnostic Bilibili music library (API client, cache, session state)"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
md5 = "0.7"
qrcode = { version = "0.14.1", default-features = false }
# webpki-roots: Android has no system cert store, so the trust anchors must be
# bundled (harmless on desktop).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio.workspace = true
