[workspace]
members = ["crates/core", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
bvox-core = { path = "crates/core" }
