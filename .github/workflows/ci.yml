name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

  tui:
    name: TUI binary
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: tui

      - name: Build (static musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p bvox-tui --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bvox-tui") | .version')
          BIN=target/x86_64-unknown-linux-musl/release/bvox
          file "$BIN"
          file "$BIN" | grep -Eq "statically linked|static-pie" \
            || { echo "::error::TUI binary is not statically linked"; exit 1; }
          strip "$BIN"
          ls -lh "$BIN"
          mkdir -p dist
          tar -czf "dist/bvox-v${VERSION}-x86_64-linux.tar.gz" -C target/x86_64-unknown-linux-musl/release bvox
          ls -lh dist

      - name: Upload TUI binary
        uses: actions/upload-artifact@v7
        with:
          name: bvox-tui
          path: dist/bvox-*-x86_64-linux.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865

      - name: Point cargo-ndk at the pinned NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional: add ANDROID_KEYSTORE_BASE64 (base64 of bvox-release.jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
      # as repository secrets to produce a signed release APK. Without them
      # the release build still runs, but the artifact is unsigned.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore secrets configured; the release APK will be unsigned."
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/bvox-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/bvox-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "BVOX_SIGNED=true" >> "$GITHUB_ENV"

      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.BVOX_SIGNED != 'true'
        run: |
          echo "::error::Tagged releases need the keystore secrets; refusing to publish an unsigned APK."
          exit 1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        if: env.BVOX_SIGNED == 'true'
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: bvox-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, tui]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: bvox-apk-${{ github.sha }}
          path: artifacts/apk

      - name: Download TUI artifact
        uses: actions/download-artifact@v8
        with:
          name: bvox-tui
          path: artifacts/tui

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/apk/release/*.apk release/
          cp artifacts/tui/*.tar.gz release/
          cd release
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Bvox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            ### 安卓
            - `bvox-v*-release.apk`：正式签名，Android 6.0+（arm64-v8a / x86_64）

            ### 桌面端
            - `bvox-v*-x86_64-linux.tar.gz`：预编译 TUI（静态链接，任意 x86_64 Linux 发行版），解压后运行 `./bvox`（需要系统安装 `mpv`）
            - 也可以从源码构建：`cargo build --release`

            ### 校验
            - `SHA256SUMS.txt`：所有发布文件的 SHA-256

            ### 主要功能
            - 搜索 B 站音乐区，只拉取 DASH 音频流
            - 歌单（B 站收藏夹）新建 / 改名 / 删除 / 隐藏
            - 离线缓存与离线歌单，已缓存音频断网可播
            - 播放模式：顺序 / 列表循环 / 单曲循环 / 随机
            - 启动恢复上次队列与进度（保持暂停）
            - 歌词视图；安卓支持通知栏 / 锁屏 / 悬浮歌词
            - 桌面端 ratatui + mpv，安卓端 Jetpack Compose + Media3
